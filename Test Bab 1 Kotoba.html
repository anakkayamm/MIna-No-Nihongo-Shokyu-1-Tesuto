<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bab 1 Kotoba - Minna no Nihongo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; margin-top: 20px;}
        button:hover { background-color: #2980b9; }
        .question-box { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ecf0f1; display: flex; align-items: center; flex-wrap: wrap; }
        .question-box span { display: inline-block; width: 220px; font-weight: 500; }
        .question-box input { flex: 1; min-width: 200px; }
        .col-layout { flex-direction: column; align-items: flex-start; }
        .col-layout span { width: 100%; margin-bottom: 10px; }
        
        #exam-section, #result-section, #loading-section { display: none; }
        .header-info { display: flex; justify-content: space-between; background: #eef2f3; padding: 15px; border-radius: 6px; margin-bottom: 25px;}
        #timer { font-size: 1.5em; font-weight: bold; color: #e74c3c; }
        
        .correct { border: 2px solid #2ecc71 !important; background-color: #eafaf1; }
        .incorrect { border: 2px solid #e74c3c !important; background-color: #fceceb; }
        .feedback { font-size: 14px; margin-top: 8px; width: 100%; padding: 8px; border-radius: 4px; display: none;}
        .feedback.benar { background-color: #d5f5e3; color: #1e8449; }
        .feedback.salah { background-color: #fadbd8; color: #c0392b; }
        .score-display { font-size: 48px; text-align: center; color: #27ae60; margin: 20px 0; font-weight: bold; }
        
        .loader { border: 6px solid #f3f3f3; border-top: 6px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <h1>テスト 第１課<br><small>Test Bab 1</small></h1>
        <div class="form-group"><label>Nama:</label><input type="text" id="student-name" required></div>
        <div class="form-group"><label>Kelas:</label><input type="text" id="student-class" required></div>
        <button onclick="startExam()">Mulai Ujian (15 Menit)</button>
    </div>

    <div id="exam-section">
        <div class="header-info">
            <div><strong>Nama:</strong> <span id="display-name"></span> <br><strong>Kelas:</strong> <span id="display-class"></span></div>
            <div id="timer">15:00</div>
        </div>

        <form id="exam-form">
            <h3>Ⅰ. インドネシア語で翻訳しなさい。</h3>
            <div id="part1"></div>
            <h3>Ⅱ. 日本語で翻訳しなさい。</h3>
            <div id="part2"></div>
            <h3>Ⅲ. この質問を答えなさい。</h3>
            <div id="part3"></div>
            <h3>Ⅳ. 日本語で書き換えてください。</h3>
            <div id="part4"></div>
            
            <div id="loading-section" style="text-align: center;">
                <div class="loader"></div>
                <p><strong>Memproses nilai...</strong></p>
            </div>

            <button type="button" id="btn-submit" onclick="submitExam()">Kumpulkan Ujian</button>
        </form>
    </div>

    <div id="result-section">
        <h1>Rapor Ujian</h1>
        <div class="score-display" id="final-score">0 / 100</div>
        <p style="text-align: center;">Gulir ke bawah untuk melihat detail koreksi.</p>
    </div>
</div>

<script>
    // URL Web App GAS (Hanya untuk mencatat ke Sheets, tanpa AI)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby57oSE4EXDOHJ7bRkDO8k0ej2zc46hsSONVH8tIQcjdgH5pQ_WqyZLXbHnXuSnMcCe/exec'; 

    let timeRemaining = 15 * 60; 
    let timerInterval;

    const absoluteKeys = {
        // Bagian 1
        "p1_0": ["beliau", "orang itu"],
        "p1_1": ["guru", "pengajar", "dosen"],
        "p1_2": ["pelajar", "mahasiswa", "murid"],
        "p1_3": ["pegawai bank", "karyawan bank", "staf bank"],
        "p1_4": ["peneliti", "periset", "ilmuwan"],
        "p1_5": ["universitas", "perguruan tinggi", "kampus"],
        "p1_6": ["umur berapa", "usia berapa", "berapa umurnya"],
        "p1_7": ["orang jepang", "warga negara jepang"],
        "p1_8": ["siapa"],
        "p1_9": ["bahasa inggris"],

        // Bagian 2
        "p2_0": ["あなた"],
        "p2_1": ["きょうし", "せんせい"],
        "p2_2": ["かいしゃいん", "しゃいん"],
        "p2_3": ["いしゃ"],
        "p2_4": ["びょういん"],
        "p2_5": ["かんこく"],
        "p2_6": ["ドイツご", "どいつご"],
        "p2_7": ["だれ", "どなた"],
        "p2_8": ["どうぞ"],
        "p2_9": ["ロシア"],

        // Bagian 3
        "p3_0": [
            "はい、わたしもがくせいです。", "はい、私も学生です。", "はい、そうです。",
            "いいえ、わたしはがくせいじゃありません。", "いいえ、私は学生じゃありません。",
            "いいえ、わたしはがくせいではありません。", "いいえ、私は学生ではありません。",
            "いいえ、がくせいじゃありません。", "いいえ、学生じゃありません。",
            "いいえ、がくせいではありません。", "いいえ、学生ではありません。",
            "いいえ、ちがいます。", "いいえ、違います。"
        ],
        "p3_1": [
            "はい、わたしはにほんじんです。", "はい、私は日本人です。",
            "はい、にほんじんです。", "はい、日本人です。", "はい、そうです。",
            "いいえ、わたしはにほんじんじゃありません。", "いいえ、私は日本人じゃありません。",
            "いいえ、わたしはにほんじんではありません。", "いいえ、私は日本人ではありません。",
            "いいえ、にほんじんじゃありません。", "いいえ、日本人じゃありません。",
            "いいえ、にほんじんではありません。", "いいえ、日本人ではありません。",
            "いいえ、インドネシアじんです。", "いいえ、インドネシア人です。",
            "いいえ、わたしはインドネシアじんです。", "いいえ、私はインドネシア人です。",
            "いいえ、ちがいます。", "いいえ、違います。"
        ],
        "p3_2": [
            "はい、パラヒヤンガンだいがくのがくせいです。", "はい、パラヒヤンガン大学の学生です。",
            "はい、わたしはパラヒヤンガンだいがくのがくせいです。", "はい、私はパラヒヤンガン大学の学生です。",
            "はい、そうです。",
            "いいえ、パラヒヤンガンだいがくのがくせいじゃありません。", "いいえ、パラヒヤンガン大学の学生じゃありません。",
            "いいえ、パラヒヤンガンだいがくのがくせいではありません。", "いいえ、パラヒヤンガン大学の学生ではありません。",
            "いいえ、わたしはパラヒヤンガンだいがくのがくせいじゃありません。", "いいえ、私はパラヒヤンガン大学の学生じゃありません。",
            "いいえ、わたしはパラヒヤンガンだいがくのがくせいではありません。", "いいえ、私はパラヒヤンガン大学の学生ではありません。",
            "いいえ、ちがいます。", "いいえ、違います。"
        ],
        // p3_3 divalidasi menggunakan fungsi Regex khusus (checkAge) karena sangat dinamis
        "p3_4": [
            "はい、カリナさんはインドネシアじんです。", "はい、カリナさんはインドネシア人です。",
            "はい、インドネシアじんです。", "はい、インドネシア人です。", "はい、そうです。",
            "いいえ、かりなさんはインドネシアじんではありません。", "いいえ、カリナさんはインドネシア人ではありません。",
            "いいえ、カリナさんはインドネシアじんじゃありません。", "いいえ、カリナさんはインドネシア人じゃありません。",
            "いいえ、インドネシアじんじゃありません。", "いいえ、インドネシア人じゃありません。",
            "いいえ、インドネシアじんではありません。", "いいえ、インドネシア人ではありません。",
            "いいえ、ちがいます。", "いいえ、違います。"
        ],

        // Bagian 4
        "p4_0": ["わたしはがくせいです。", "私は学生です。"],
        "p4_1": ["カリナさんはインドネシアじんです。", "カリナさんはインドネシア人です。"],
        "p4_2": ["やまださんはぎんこういんです。", "山田さんは銀行員です。"],
        "p4_3": ["わたしは28さいです。", "私は28歳です。", "わたしはにじゅうはっさいです。", "私は二十八歳です。"],
        "p4_4": ["ミラーさんはimcのしゃいんです。", "ミラーさんはimcの社員です。"]
    };

    const part1 = [
        { id: "p1_0", q: "1. あのかた", pts: 1 }, { id: "p1_1", q: "2. せんせい", pts: 1 },
        { id: "p1_2", q: "3. がくせい", pts: 1 }, { id: "p1_3", q: "4. ぎんこういん", pts: 1 },
        { id: "p1_4", q: "5. けんきゅうしゃ", pts: 1 }, { id: "p1_5", q: "6. だいがく", pts: 1 },
        { id: "p1_6", q: "7. おいくつ", pts: 1 }, { id: "p1_7", q: "8. にほんじん", pts: 1 },
        { id: "p1_8", q: "9. どなた", pts: 1 }, { id: "p1_9", q: "10. えいご", pts: 1 }
    ];
    const part2 = [
        { id: "p2_0", q: "1. Kamu / Anda", pts: 1 }, { id: "p2_1", q: "2. Pengajar / Guru", pts: 1 },
        { id: "p2_2", q: "3. Karyawan", pts: 1 }, { id: "p2_3", q: "4. Dokter", pts: 1 },
        { id: "p2_4", q: "5. Rumah Sakit", pts: 1 }, { id: "p2_5", q: "6. Korea Selatan", pts: 1 },
        { id: "p2_6", q: "7. Bahasa Jerman", pts: 1 }, { id: "p2_7", q: "8. Siapa?", pts: 1 },
        { id: "p2_8", q: "9. Silahkan", pts: 1 }, { id: "p2_9", q: "10. Rusia", pts: 1 }
    ];
    const part3 = [
        { id: "p3_0", q: "1. カリナさんはがくせいです。あなたもがくせいですか。", pts: 2 },
        { id: "p3_1", q: "2. あなたはにほんじんですか。", pts: 2 },
        { id: "p3_2", q: "3. あなたはパラヒヤンガン大学のがくせいですか。", pts: 2 },
        { id: "p3_3", q: "4. あなたはなんさいですか。", pts: 2 },
        { id: "p3_4", q: "5. カリナさんはインドネシアじんですか。", pts: 2 }
    ];
    const part4 = [
        { id: "p4_0", q: "1. Saya adalah pelajar.", pts: 2 },
        { id: "p4_1", q: "2. Karina adalah orang Indonesia.", pts: 2 },
        { id: "p4_2", q: "3. Yamada adalah pegawai bank.", pts: 2 },
        { id: "p4_3", q: "4. Saya berumur 28 tahun.", pts: 2 },
        { id: "p4_4", q: "5. Mira- adalah pegawai IMC.", pts: 2 }
    ];

    const allQuestions = [...part1, ...part2, ...part3, ...part4];

    function renderQuestions(partArray, containerId) {
        const container = document.getElementById(containerId);
        partArray.forEach(item => {
            const isCol = item.pts === 2;
            container.innerHTML += `
                <div class="question-box ${isCol ? 'col-layout' : ''}">
                    <span>${item.q}</span>
                    <input type="text" id="${item.id}" autocomplete="off">
                    <div id="feed_${item.id}" class="feedback"></div>
                </div>`;
        });
    }

    renderQuestions(part1, 'part1'); renderQuestions(part2, 'part2');
    renderQuestions(part3, 'part3'); renderQuestions(part4, 'part4');

    function startExam() {
        const name = document.getElementById('student-name').value;
        const studentClass = document.getElementById('student-class').value;
        if (!name || !studentClass) return alert("Isi Nama dan Kelas terlebih dahulu!");
        document.getElementById('display-name').innerText = name;
        document.getElementById('display-class').innerText = studentClass;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('exam-section').style.display = 'block';
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        if (timeRemaining <= 0) { clearInterval(timerInterval); submitExam(true); }
        else { timeRemaining--; }
        const m = Math.floor(timeRemaining / 60); const s = timeRemaining % 60;
        document.getElementById('timer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // Fungsi khusus mendeteksi jawaban umur (Angka, Hiragana, Kanji) dengan dinamis
    function checkAge(ans) {
        let jwb = ans.replace(/\s+/g, '');
        // Mengizinkan digit/huruf apapun asal diakhiri dengan satuan umur + titik
        if (/^(わたしは|私は)?.+(さい|歳)です。$/.test(jwb)) return true;
        
        let special = ["わたしははたちです。", "私は二十歳です。", "私ははたちです。", "はたちです。", "二十歳です。"];
        return special.includes(jwb);
    }

    function submitExam(isAuto = false) {
        if (!isAuto && !confirm("Kumpulkan ujian sekarang?")) return;
        clearInterval(timerInterval);
        
        document.getElementById('btn-submit').style.display = 'none';
        document.getElementById('loading-section').style.display = 'block';
        
        let hasilInstan = [];
        let poinLokal = 0;

        // KOREKSI LOKAL 100% INSTAN
        allQuestions.forEach(item => {
            const el = document.getElementById(item.id);
            el.readOnly = true; 
            
            let jwbSiswa = el.value.trim();
            let isBenar = false;

            if (item.id === "p3_3") {
                isBenar = checkAge(jwbSiswa);
            } else {
                // Hapus seluruh spasi dan ubah ke huruf kecil untuk proses pencocokan yang fleksibel
                let jwbCek = jwbSiswa.replace(/\s+/g, '').toLowerCase();
                let validKeys = absoluteKeys[item.id].map(k => k.replace(/\s+/g, '').toLowerCase());
                
                if (validKeys.includes(jwbCek)) {
                    isBenar = true;
                }
            }

            if (isBenar) {
                poinLokal += item.pts; 
                hasilInstan.push({ id: item.id, status: "benar", komentar: "Tepat sekali!" });
            } else {
                // Jika salah, tampilkan kunci jawaban pertama dari array sebagai referensi
                let kunciBenar = "";
                if (item.id === "p3_3") {
                    kunciBenar = "わたしは[angka]さいです。";
                } else if (absoluteKeys[item.id]) {
                    kunciBenar = absoluteKeys[item.id][0];
                }
                hasilInstan.push({ id: item.id, status: "salah", komentar: `Jawaban tepat: ${kunciBenar}` });
            }
        });

        const finalScore = Math.round((poinLokal / 40) * 100);

        // Tampilkan Rapor Seketika (0 Detik)
        document.getElementById('loading-section').style.display = 'none';
        tampilkanRapor(finalScore, hasilInstan);

        // Kirim Rekap ke Google Sheets di Latar Belakang (Tanpa loading screen)
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                nama: document.getElementById('display-name').innerText,
                kelas: document.getElementById('display-class').innerText,
                bab: "Bab 1",
                finalScore: finalScore,
                aiText: "Koreksi Lokal 100% (Non-AI)"
            })
        }).catch(e => console.log("Background log error:", e));
    }

    function tampilkanRapor(score, evaluations) {
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / 100`;
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });

        evaluations.forEach(ev => {
            const inputEl = document.getElementById(ev.id);
            const feedEl = document.getElementById(`feed_${ev.id}`);
            if(inputEl && feedEl) {
                if(ev.status === "benar" || ev.status === "sebagian") {
                    inputEl.classList.add('correct');
                    feedEl.classList.add('benar');
                } else {
                    inputEl.classList.add('incorrect');
                    feedEl.classList.add('salah');
                }
                feedEl.innerHTML = `<strong>Koreksi:</strong> ${ev.komentar}`;
                feedEl.style.display = 'block';
            }
        });
    }
</script>
</body>
</html>
